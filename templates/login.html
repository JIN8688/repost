{% extends "base.html" %}

{% block title %}로그인 - Repost{% endblock %}

{% block extra_css %}
<style>
    /* 홈 배경 그대로 사용 */
    body {
        background: 
            radial-gradient(at 27% 37%, rgba(102, 126, 234, 0.8) 0px, transparent 50%),
            radial-gradient(at 97% 21%, rgba(125, 235, 200, 0.7) 0px, transparent 50%),
            radial-gradient(at 52% 99%, rgba(244, 107, 153, 0.7) 0px, transparent 50%),
            radial-gradient(at 10% 29%, rgba(118, 75, 162, 0.8) 0px, transparent 50%),
            #1a1a2e !important;
        background-attachment: fixed !important;
    }

    .login-container {
        max-width: 480px;
        margin: 100px auto 60px;
        padding: 0 20px;
    }
    
    @media (max-width: 768px) {
        .login-container {
            margin: 30px auto 40px;
        }
    }

    .login-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        border-radius: 28px;
        padding: 50px 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                    0 0 0 1px rgba(255, 255, 255, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.4);
        animation: fadeInUp 0.8s ease-out;
    }
    
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @media (max-width: 768px) {
        .login-card {
            padding: 35px 28px;
        }
    }

    .login-title {
        font-size: 2rem;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 10px;
        text-align: center;
    }

    .login-subtitle {
        color: #64748b;
        text-align: center;
        margin-bottom: 32px;
        font-size: 1.05rem;
    }

    /* 소셜 로그인 버튼 */
    .social-login-section {
        margin-bottom: 32px;
    }

    .social-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-bottom: 28px;
    }
    
    @media (max-width: 768px) {
        .social-buttons {
            grid-template-columns: 1fr;
        }
    }

    .social-btn {
        padding: 14px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        background: white;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 600;
        font-size: 0.95rem;
    }

    .social-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .social-btn.google {
        color: #1a1a2e;
    }

    .social-btn.google:hover {
        border-color: #4285F4;
        background: #f8fafc;
    }

    .social-btn.kakao {
        background: #FEE500;
        border-color: #FEE500;
        color: #000000 !important;
    }

    .social-btn.kakao:hover {
        background: #FDD835;
        border-color: #FDD835;
    }

    .social-btn.naver {
        background: #03C75A;
        border-color: #03C75A;
        color: white;
    }

    .social-btn.naver:hover {
        background: #02B350;
        border-color: #02B350;
    }

    .social-icon {
        width: 20px;
        height: 20px;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 28px 0;
        color: #94a3b8;
        font-size: 0.9rem;
    }

    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e2e8f0;
    }

    /* 폼 스타일 */
    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        color: #2d3748;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .input-wrapper {
        position: relative;
    }

    .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.3s ease;
        background: white;
    }

    .form-input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .form-input.error {
        border-color: #ef4444;
    }

    .form-input.success {
        border-color: #10b981;
    }

    .input-icon {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.2rem;
    }

    .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }

    .remember-me input {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #667eea;
    }

    .remember-me label {
        font-size: 0.9rem;
        color: #64748b;
        cursor: pointer;
    }

    .forgot-password {
        color: #667eea;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
    }

    .forgot-password:hover {
        text-decoration: underline;
    }

    .btn-login {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        letter-spacing: 0.02em;
    }

    .btn-login:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(102, 126, 234, 0.5);
        background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }

    .btn-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    
    .btn-login:active {
        transform: translateY(-1px);
    }

    .signup-link {
        text-align: center;
        color: #64748b;
        font-size: 0.95rem;
        margin-top: 24px;
    }

    .signup-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
    }

    .signup-link a:hover {
        text-decoration: underline;
    }

    /* Toast 알림 */
    .toast {
        position: fixed;
        top: 100px;
        right: 20px;
        background: white;
        padding: 20px 24px;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        z-index: 10000;
        display: none;
        align-items: center;
        gap: 12px;
        min-width: 320px;
        animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
        from {
            transform: translateX(400px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    .toast.show {
        display: flex;
    }

    .toast.success {
        border-left: 4px solid #10b981;
    }

    .toast.error {
        border-left: 4px solid #ef4444;
    }

    .toast-icon {
        font-size: 1.5rem;
    }

    .toast-content h4 {
        margin: 0 0 4px 0;
        color: #1a1a2e;
        font-size: 1rem;
        font-weight: 700;
    }

    .toast-content p {
        margin: 0;
        color: #64748b;
        font-size: 0.9rem;
    }

    @media (max-width: 768px) {
        .toast {
            right: 20px;
            left: 20px;
            min-width: auto;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1 class="login-title">👋 로그인</h1>
        <p class="login-subtitle">Repost에 다시 오신 것을 환영합니다!</p>

        <!-- 소셜 로그인 -->
        <div class="social-login-section">
            <div class="social-buttons">
                <button class="social-btn google" onclick="socialLogin('google')">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Google</span>
                </button>
                <button class="social-btn kakao" onclick="socialLogin('kakao')">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12 3c5.799 0 10.5 3.664 10.5 8.185 0 4.52-4.701 8.184-10.5 8.184a13.5 13.5 0 0 1-1.727-.11l-4.408 2.883c-.501.265-.678.236-.472-.413l.892-3.678c-2.88-1.46-4.785-3.99-4.785-6.866C1.5 6.665 6.201 3 12 3z"/>
                    </svg>
                    <span>Kakao</span>
                </button>
                <button class="social-btn naver" onclick="socialLogin('naver')">
                    <svg class="social-icon" viewBox="0 0 24 24" fill="white">
                        <path d="M16.273 12.845 7.376 0H0v24h7.726V11.156L16.624 24H24V0h-7.727v12.845Z"/>
                    </svg>
                    <span>Naver</span>
                </button>
            </div>
        </div>

        <div class="divider">이메일로 로그인</div>

        <!-- 로그인 폼 -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <!-- 이메일 -->
            <div class="form-group">
                <label class="form-label">이메일</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="form-input" placeholder="example@email.com" required>
                    <span class="input-icon" id="emailIcon"></span>
                </div>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="비밀번호를 입력하세요" required>
                    <span class="input-icon" id="passwordIcon"></span>
                </div>
            </div>

            <!-- 옵션 -->
            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">로그인 상태 유지</label>
                </div>
                <a href="#" class="forgot-password" onclick="showForgotPassword(); return false;">비밀번호 찾기</a>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">로그인하기 🚀</button>
        </form>

        <div class="signup-link">
            아직 계정이 없으신가요? <a href="/signup">회원가입</a>
        </div>
    </div>
</div>

<!-- Toast 알림 -->
<div class="toast" id="toast">
    <div class="toast-icon" id="toastIcon"></div>
    <div class="toast-content">
        <h4 id="toastTitle"></h4>
        <p id="toastMessage"></p>
    </div>
</div>

<script>
// Toast 알림
function showToast(title, message, type = 'success') {
    const toast = document.getElementById('toast');
    const toastIcon = document.getElementById('toastIcon');
    const toastTitle = document.getElementById('toastTitle');
    const toastMessage = document.getElementById('toastMessage');
    
    toast.classList.remove('success', 'error');
    toast.classList.add(type);
    
    toastIcon.textContent = type === 'success' ? '✅' : '❌';
    toastTitle.textContent = title;
    toastMessage.textContent = message;
    
    toast.classList.add('show');
    
    setTimeout(() => {
        toast.classList.remove('show');
    }, 4000);
}

// 실시간 유효성 검사
document.getElementById('email').addEventListener('input', (e) => {
    const input = e.target;
    const value = input.value.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    
    if (emailRegex.test(value)) {
        input.classList.remove('error');
        input.classList.add('success');
        document.getElementById('emailIcon').textContent = '✓';
        document.getElementById('emailIcon').style.color = '#10b981';
    } else {
        input.classList.remove('success');
        document.getElementById('emailIcon').textContent = '';
    }
});

document.getElementById('password').addEventListener('input', (e) => {
    const input = e.target;
    const value = input.value;
    
    if (value.length >= 8) {
        document.getElementById('passwordIcon').textContent = '✓';
        document.getElementById('passwordIcon').style.color = '#10b981';
    } else {
        document.getElementById('passwordIcon').textContent = '';
    }
});

// 소셜 로그인
function socialLogin(provider) {
    // OAuth 인증 페이지로 리다이렉트
    window.location.href = `/auth/${provider}`;
}

// 비밀번호 찾기
function showForgotPassword() {
    showToast(
        '비밀번호 찾기',
        'contact@repost.kr로 문의해주세요!',
        'error'
    );
}

// 로그인 처리
async function handleLogin(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const rememberMe = document.getElementById('rememberMe').checked;
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '로그인 중...';
    
    try {
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email, 
                password,
                rememberMe
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            showToast(
                '로그인 성공! 🎉',
                '홈으로 이동합니다...',
                'success'
            );
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        } else {
            showToast('로그인 실패', data.error || '이메일 또는 비밀번호를 확인해주세요', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = '로그인하기 🚀';
        }
    } catch (error) {
        showToast('오류 발생', '로그인 중 오류가 발생했습니다', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = '로그인하기 🚀';
    }
}
</script>
{% endblock %}
