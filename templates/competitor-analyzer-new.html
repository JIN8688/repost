{% extends "base.html" %}

{% block title %}경쟁 블로그 분석 - Repost{% endblock %}

{% block extra_css %}
<style>
    /* 홈 배경 그대로 사용 */
    body {
        background: 
            radial-gradient(at 27% 37%, rgba(102, 126, 234, 0.8) 0px, transparent 50%),
            radial-gradient(at 97% 21%, rgba(125, 235, 200, 0.7) 0px, transparent 50%),
            radial-gradient(at 52% 99%, rgba(244, 107, 153, 0.7) 0px, transparent 50%),
            radial-gradient(at 10% 29%, rgba(118, 75, 162, 0.8) 0px, transparent 50%),
            #1a1a2e !important;
        background-attachment: fixed !important;
    }

    .page-header {
        text-align: center;
        padding: 60px 20px 40px;
        animation: fadeInDown 0.6s ease-out;
    }

    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .page-header h1 {
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        font-weight: 800;
        color: white;
        margin-bottom: 10px;
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
    }

    .page-header p {
        font-size: clamp(0.95rem, 2.5vw, 1.1rem);
        color: rgba(255, 255, 255, 0.95);
        font-weight: 500;
    }
    
    .tier-badge {
        display: inline-block;
        background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        color: white;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 6px 14px;
        border-radius: 16px;
        font-size: 0.8rem;
        box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        margin-left: 12px;
        animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px 80px;
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 28px;
        padding: 35px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                    0 0 0 1px rgba(255, 255, 255, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.8);
        margin-bottom: 30px;
        animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-label {
        display: block;
        color: #1a1a2e;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.95rem;
    }

    .input-field {
        width: 100%;
        padding: 14px 18px;
        background: white;
        border: 2px solid #e2e8f0;
        border-radius: 14px;
        color: #1a1a2e;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.3s ease;
    }

    .input-field:focus {
        outline: none;
        background: #f8fafc;
        border-color: #ec4899;
        box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
    }

    .input-field::placeholder {
        color: #94a3b8;
    }

    .analyze-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
    }

    .analyze-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(139, 92, 246, 0.5);
    }

    .analyze-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .copy-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        margin-top: 20px;
    }

    .copy-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    }

    .copy-btn.copied {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    }

    .analysis-section {
        margin-bottom: 30px;
    }

    .section-title {
        font-size: 1.3rem;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
    }

    .metric-card {
        background: #f8fafc;
        border: 2px solid #e2e8f0;
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        transition: all 0.3s ease;
    }

    .metric-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .metric-value {
        font-size: 2rem;
        font-weight: 800;
        color: #8b5cf6;
        margin-bottom: 5px;
    }

    .metric-label {
        font-size: 0.9rem;
        color: #64748b;
        font-weight: 600;
    }

    .insight-list {
        list-style: none;
        padding: 0;
    }

    .insight-item {
        background: #f8fafc;
        border-left: 4px solid #8b5cf6;
        padding: 15px 20px;
        margin-bottom: 12px;
        border-radius: 8px;
        font-weight: 500;
        color: #475569;
    }

    .strategy-box {
        background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        border: 2px solid #fbbf24;
        border-radius: 18px;
        padding: 25px;
        margin-top: 20px;
    }

    .strategy-title {
        font-size: 1.2rem;
        font-weight: 700;
        color: #92400e;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .strategy-text {
        color: #78350f;
        font-weight: 500;
        line-height: 1.7;
    }

    .loading {
        text-align: center;
        padding: 60px 20px;
    }

    .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid #e2e8f0;
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .loading-text {
        color: #475569;
        font-size: 1.1rem;
        font-weight: 600;
    }

    .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: #64748b;
    }

    .empty-icon {
        font-size: 5rem;
        margin-bottom: 20px;
        opacity: 0.5;
    }

    /* Toast 알림 */
    .toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: white;
        color: #1a1a2e;
        padding: 16px 24px;
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 10000;
        animation: slideInUp 0.3s ease-out;
        min-width: 300px;
        border: 2px solid #e2e8f0;
    }

    .toast.error {
        background: #fef2f2;
        border-color: #fecaca;
    }

    .toast.success {
        background: #f0fdf4;
        border-color: #bbf7d0;
    }

    @keyframes slideInUp {
        from {
            opacity: 0;
            transform: translateY(100px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 768px) {
        .page-header {
            padding: 40px 20px 30px;
        }
        
        .glass-card {
            padding: 24px;
        }
        
        .metrics-grid {
            grid-template-columns: repeat(2, 1fr);
        }
        
        .toast {
            right: 20px;
            left: 20px;
            min-width: auto;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>🔍 경쟁 블로그 분석<span class="tier-badge">💎 PRO</span></h1>
    <p>경쟁 블로그를 분석하고 이길 수 있는 전략을 AI가 제시합니다</p>
</div>

<div class="container">
    <!-- 📝 입력 섹션 -->
    <div class="glass-card">
        <h2 class="card-title">
            <span>🎯</span>
            경쟁 블로그 URL 입력
        </h2>
        
        <div class="input-group">
            <label class="input-label">경쟁 블로그 URL</label>
            <input type="text" 
                   id="urlInput" 
                   class="input-field" 
                   placeholder="예: https://blog.naver.com/...">
        </div>

        <button id="analyzeBtn" class="analyze-btn" onclick="analyzeCompetitor()">
            🔍 경쟁 블로그 분석 시작
        </button>
    </div>

    <!-- 📊 결과 섹션 -->
    <div class="glass-card" id="resultsCard" style="display: none;">
        <h2 class="card-title">
            <span>📈</span>
            분석 결과
        </h2>

        <div id="resultsContainer"></div>

        <button id="copyBtn" class="copy-btn" onclick="copyResults()">
            📋 분석 결과 복사하기
        </button>
    </div>
</div>

<script>
    let analysisData = '';

    // Toast 알림
    function showToast(message, type = 'info') {
        const existingToast = document.querySelector('.toast');
        if (existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icon = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
        toast.innerHTML = `<span style="font-size: 1.5rem;">${icon}</span><span style="font-weight: 600;">${message}</span>`;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = 'slideInUp 0.3s ease-out reverse';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // 공통 복사 함수
    function copyToClipboard(text, button, successMessage = '복사 완료!') {
        navigator.clipboard.writeText(text).then(() => {
            const originalHTML = button.innerHTML;
            button.innerHTML = '복사됨! ✓';
            button.classList.add('copied');
            showToast(successMessage, 'success');
            setTimeout(() => {
                button.innerHTML = originalHTML;
                button.classList.remove('copied');
            }, 2000);
        }).catch(err => {
            showToast('복사에 실패했습니다', 'error');
            console.error('복사 오류:', err);
        });
    }

    // 결과 복사
    function copyResults() {
        const button = document.getElementById('copyBtn');
        copyToClipboard(analysisData, button, '분석 결과가 복사되었습니다!');
    }

    async function analyzeCompetitor() {
        const url = document.getElementById('urlInput').value.trim();
        const btn = document.getElementById('analyzeBtn');
        const resultsCard = document.getElementById('resultsCard');
        const container = document.getElementById('resultsContainer');

        if (!url) {
            showToast('경쟁 블로그 URL을 입력해주세요!', 'error');
            document.getElementById('urlInput').focus();
            return;
        }

        if (!url.includes('blog.naver.com')) {
            showToast('네이버 블로그 URL을 입력해주세요!', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span style="display: inline-block; animation: spin 1s linear infinite;">🔍</span> 경쟁 블로그 분석 중...';
        resultsCard.style.display = 'block';
        container.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <div class="loading-text">AI가 경쟁 블로그를 분석하고 있습니다...</div>
                <div style="color: #94a3b8; font-size: 0.9rem; margin-top: 10px;">잠시만 기다려주세요 (최대 30초)</div>
            </div>
        `;

        try {
            const response = await fetch('/api/analyze-competitor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: 서버 오류`);
            }

            const data = await response.json();

            if (data.success) {
                displayResults(data.analysis);
                showToast('경쟁 블로그 분석이 완료되었습니다!', 'success');
            } else {
                throw new Error(data.error || '분석 실패');
            }
        } catch (error) {
            console.error('분석 오류:', error);
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">❌</div>
                    <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; color: #dc2626;">분석 중 오류가 발생했습니다</div>
                    <div style="font-size: 0.95rem; opacity: 0.7; margin-bottom: 20px;">${error.message}</div>
                    <button onclick="analyzeCompetitor()" style="padding: 10px 20px; background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
                        🔄 다시 시도
                    </button>
                </div>
            `;
            showToast('분석 중 오류가 발생했습니다', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '🔍 경쟁 블로그 분석 시작';
        }
    }

    function displayResults(analysis) {
        const container = document.getElementById('resultsContainer');
        
        // 복사용 텍스트 저장
        analysisData = JSON.stringify(analysis, null, 2);
        
        let html = '';
        
        // 기본 정보
        html += '<div class="analysis-section">';
        html += '<div class="section-title">📋 블로그 기본 정보</div>';
        html += '<div class="metrics-grid">';
        html += `<div class="metric-card"><div class="metric-value">${analysis.metrics?.total_posts || 'N/A'}</div><div class="metric-label">총 포스팅 수</div></div>`;
        html += `<div class="metric-card"><div class="metric-value">${analysis.metrics?.avg_length || 'N/A'}</div><div class="metric-label">평균 글자 수</div></div>`;
        html += `<div class="metric-card"><div class="metric-value">${analysis.metrics?.posting_frequency || 'N/A'}</div><div class="metric-label">포스팅 빈도</div></div>`;
        html += '</div></div>';
        
        // 강점 분석
        if (analysis.strengths && analysis.strengths.length > 0) {
            html += '<div class="analysis-section">';
            html += '<div class="section-title">💪 경쟁 블로그의 강점</div>';
            html += '<ul class="insight-list">';
            analysis.strengths.forEach(s => {
                html += `<li class="insight-item">${s}</li>`;
            });
            html += '</ul></div>';
        }
        
        // 약점 분석
        if (analysis.weaknesses && analysis.weaknesses.length > 0) {
            html += '<div class="analysis-section">';
            html += '<div class="section-title">🎯 경쟁 블로그의 약점 (기회 요소)</div>';
            html += '<ul class="insight-list">';
            analysis.weaknesses.forEach(w => {
                html += `<li class="insight-item">${w}</li>`;
            });
            html += '</ul></div>';
        }
        
        // 승리 전략
        if (analysis.strategy) {
            html += '<div class="strategy-box">';
            html += '<div class="strategy-title">🏆 승리 전략</div>';
            html += `<div class="strategy-text">${analysis.strategy}</div>`;
            html += '</div>';
        }
        
        container.innerHTML = html;
    }
</script>
{% endblock %}
