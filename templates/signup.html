{% extends "base.html" %}

{% block title %}회원가입 - Repost{% endblock %}

{% block extra_css %}
<style>
    /* 홈 배경 그대로 사용 */
    body {
        background: 
            radial-gradient(at 27% 37%, rgba(102, 126, 234, 0.8) 0px, transparent 50%),
            radial-gradient(at 97% 21%, rgba(125, 235, 200, 0.7) 0px, transparent 50%),
            radial-gradient(at 52% 99%, rgba(244, 107, 153, 0.7) 0px, transparent 50%),
            radial-gradient(at 10% 29%, rgba(118, 75, 162, 0.8) 0px, transparent 50%),
            #1a1a2e !important;
        background-attachment: fixed !important;
    }

    .signup-container {
        max-width: 480px;
        margin: 100px auto 60px;
        padding: 0 20px;
    }
    
    @media (max-width: 768px) {
        .signup-container {
            margin: 30px auto 40px;
        }
    }

    .signup-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        border-radius: 28px;
        padding: 50px 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                    0 0 0 1px rgba(255, 255, 255, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.4);
        animation: fadeInUp 0.8s ease-out;
    }
    
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @media (max-width: 768px) {
        .signup-card {
            padding: 35px 28px;
        }
    }

    .signup-title {
        font-size: 2rem;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 10px;
        text-align: center;
    }

    .signup-subtitle {
        color: #64748b;
        text-align: center;
        margin-bottom: 32px;
        font-size: 1.05rem;
    }

    /* 소셜 로그인 버튼 */
    .social-login-section {
        margin-bottom: 32px;
    }

    .social-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-bottom: 28px;
    }
    
    @media (max-width: 768px) {
        .social-buttons {
            grid-template-columns: 1fr;
        }
    }

    .social-btn {
        padding: 14px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        background: white;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 600;
        font-size: 0.95rem;
    }

    .social-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .social-btn.google {
        color: #1a1a2e;
    }

    .social-btn.google:hover {
        border-color: #4285F4;
        background: #f8fafc;
    }

    .social-btn.kakao {
        background: #FEE500;
        border-color: #FEE500;
        color: #000000 !important;
    }

    .social-btn.kakao:hover {
        background: #FDD835;
        border-color: #FDD835;
    }

    .social-btn.naver {
        background: #03C75A;
        border-color: #03C75A;
        color: white;
    }

    .social-btn.naver:hover {
        background: #02B350;
        border-color: #02B350;
    }

    .social-icon {
        width: 20px;
        height: 20px;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 28px 0;
        color: #94a3b8;
        font-size: 0.9rem;
    }

    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e2e8f0;
    }

    /* 폼 스타일 */
    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        color: #2d3748;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .input-wrapper {
        position: relative;
    }

    .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.3s ease;
        background: white;
    }

    .form-input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .form-input.error {
        border-color: #ef4444;
    }

    .form-input.success {
        border-color: #10b981;
    }

    .input-icon {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.2rem;
    }

    .error-message {
        color: #ef4444;
        font-size: 0.85rem;
        margin-top: 6px;
        display: none;
    }

    .error-message.show {
        display: block;
    }

    /* 비밀번호 강도 표시 */
    .password-strength {
        margin-top: 10px;
        display: none;
    }

    .password-strength.show {
        display: block;
    }

    .strength-bar {
        height: 4px;
        background: #e2e8f0;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 6px;
    }

    .strength-fill {
        height: 100%;
        transition: all 0.3s ease;
        border-radius: 2px;
    }

    .strength-fill.weak {
        width: 33%;
        background: #ef4444;
    }

    .strength-fill.medium {
        width: 66%;
        background: #f59e0b;
    }

    .strength-fill.strong {
        width: 100%;
        background: #10b981;
    }

    .strength-text {
        font-size: 0.85rem;
        font-weight: 600;
    }

    .strength-text.weak {
        color: #ef4444;
    }

    .strength-text.medium {
        color: #f59e0b;
    }

    .strength-text.strong {
        color: #10b981;
    }

    /* 약관 동의 */
    .terms-section {
        margin: 24px 0;
    }

    .checkbox-group {
        margin-bottom: 12px;
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        padding: 12px 16px;
        background: #f8fafc;
        border-radius: 10px;
        transition: all 0.2s ease;
    }

    .checkbox-label:hover {
        background: #f1f5f9;
    }

    .checkbox-input {
        width: 20px;
        height: 20px;
        cursor: pointer;
        accent-color: #667eea;
    }

    .checkbox-text {
        flex: 1;
        font-size: 0.95rem;
        color: #2d3748;
    }

    .checkbox-text.main {
        font-weight: 600;
    }

    .checkbox-link {
        color: #667eea;
        text-decoration: underline;
        font-size: 0.9rem;
    }

    .btn-signup {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        letter-spacing: 0.02em;
        margin-top: 8px;
    }

    .btn-signup:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(102, 126, 234, 0.5);
        background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }

    .btn-signup:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    
    .btn-signup:active {
        transform: translateY(-1px);
    }

    .login-link {
        text-align: center;
        color: #64748b;
        font-size: 0.95rem;
        margin-top: 24px;
    }

    .login-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    /* Toast 알림 */
    .toast {
        position: fixed;
        top: 100px;
        right: 20px;
        background: white;
        padding: 20px 24px;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        z-index: 10000;
        display: none;
        align-items: center;
        gap: 12px;
        min-width: 320px;
        animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
        from {
            transform: translateX(400px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    .toast.show {
        display: flex;
    }

    .toast.success {
        border-left: 4px solid #10b981;
    }

    .toast.error {
        border-left: 4px solid #ef4444;
    }

    .toast-icon {
        font-size: 1.5rem;
    }

    .toast-content h4 {
        margin: 0 0 4px 0;
        color: #1a1a2e;
        font-size: 1rem;
        font-weight: 700;
    }

    .toast-content p {
        margin: 0;
        color: #64748b;
        font-size: 0.9rem;
    }

    @media (max-width: 768px) {
        .toast {
            right: 20px;
            left: 20px;
            min-width: auto;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="signup-container">
    <div class="signup-card">
        <h1 class="signup-title">🚀 회원가입</h1>
        <p class="signup-subtitle">Repost와 함께 블로그를 성장시키세요!</p>

        <!-- 소셜 로그인 -->
        <div class="social-login-section">
            <div class="social-buttons">
                <button class="social-btn google" onclick="socialLogin('google')">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Google</span>
                </button>
                <button class="social-btn kakao" onclick="socialLogin('kakao')">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12 3c5.799 0 10.5 3.664 10.5 8.185 0 4.52-4.701 8.184-10.5 8.184a13.5 13.5 0 0 1-1.727-.11l-4.408 2.883c-.501.265-.678.236-.472-.413l.892-3.678c-2.88-1.46-4.785-3.99-4.785-6.866C1.5 6.665 6.201 3 12 3z"/>
                    </svg>
                    <span>Kakao</span>
                </button>
                <button class="social-btn naver" onclick="socialLogin('naver')">
                    <svg class="social-icon" viewBox="0 0 24 24" fill="white">
                        <path d="M16.273 12.845 7.376 0H0v24h7.726V11.156L16.624 24H24V0h-7.727v12.845Z"/>
                    </svg>
                    <span>Naver</span>
                </button>
            </div>
        </div>

        <div class="divider">이메일로 가입하기</div>

        <!-- 회원가입 폼 -->
        <form id="signupForm" onsubmit="handleSignup(event)">
            <!-- 이름 -->
            <div class="form-group">
                <label class="form-label">이름</label>
                <div class="input-wrapper">
                    <input type="text" id="name" class="form-input" placeholder="홍길동" required>
                    <span class="input-icon" id="nameIcon"></span>
                </div>
                <div class="error-message" id="nameError"></div>
            </div>

            <!-- 이메일 -->
            <div class="form-group">
                <label class="form-label">이메일</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="form-input" placeholder="example@email.com" required>
                    <span class="input-icon" id="emailIcon"></span>
                </div>
                <button type="button" class="btn-verification" id="sendCodeBtn" onclick="sendVerificationCode()" style="margin-top: 10px; width: 100%; padding: 12px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer;">
                    📧 인증 코드 발송
                </button>
                <div class="error-message" id="emailError"></div>
            </div>

            <!-- 이메일 인증 코드 -->
            <div class="form-group" id="verificationGroup" style="display: none;">
                <label class="form-label">인증 코드 (6자리)</label>
                <div class="input-wrapper">
                    <input type="text" id="verificationCode" class="form-input" placeholder="123456" maxlength="6" pattern="\d{6}">
                    <span class="input-icon" id="verificationIcon"></span>
                </div>
                <button type="button" class="btn-verification" id="verifyCodeBtn" onclick="verifyEmailCode()" style="margin-top: 10px; width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer;">
                    ✓ 인증 확인
                </button>
                <div class="error-message" id="verificationError"></div>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="8자 이상, 영문+숫자 조합" required style="padding-right: 50px;">
                    <span class="input-icon password-toggle" id="passwordToggle" onclick="togglePasswordVisibility('password', 'passwordToggle')" style="cursor: pointer;">👁️</span>
                </div>
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <div class="strength-text" id="strengthText"></div>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
                <label class="form-label">비밀번호 확인</label>
                <div class="input-wrapper">
                    <input type="password" id="passwordConfirm" class="form-input" placeholder="비밀번호를 다시 입력하세요" required style="padding-right: 50px;">
                    <span class="input-icon password-toggle" id="passwordConfirmToggle" onclick="togglePasswordVisibility('passwordConfirm', 'passwordConfirmToggle')" style="cursor: pointer;">👁️</span>
                </div>
                <div class="error-message" id="passwordConfirmError"></div>
            </div>

            <!-- 약관 동의 -->
            <div class="terms-section">
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" id="agreeAll" onchange="toggleAllTerms()">
                        <span class="checkbox-text main">전체 동의</span>
                    </label>
                </div>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input term-checkbox" id="terms" required>
                        <span class="checkbox-text">(필수) <a href="/terms" target="_blank" class="checkbox-link">이용약관</a> 동의</span>
                    </label>
                </div>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input term-checkbox" id="privacy" required>
                        <span class="checkbox-text">(필수) <a href="/privacy" target="_blank" class="checkbox-link">개인정보처리방침</a> 동의</span>
                    </label>
                </div>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input term-checkbox" id="marketing">
                        <span class="checkbox-text">(선택) 마케팅 정보 수신 동의</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-signup" id="submitBtn">무료로 시작하기 🚀</button>
        </form>

        <div class="login-link">
            이미 계정이 있으신가요? <a href="/login-page">로그인</a>
        </div>
    </div>
</div>

<!-- Toast 알림 -->
<div class="toast" id="toast">
    <div class="toast-icon" id="toastIcon"></div>
    <div class="toast-content">
        <h4 id="toastTitle"></h4>
        <p id="toastMessage"></p>
    </div>
</div>

<script>
// Toast 알림
function showToast(title, message, type = 'success') {
    const toast = document.getElementById('toast');
    const toastIcon = document.getElementById('toastIcon');
    const toastTitle = document.getElementById('toastTitle');
    const toastMessage = document.getElementById('toastMessage');
    
    toast.classList.remove('success', 'error');
    toast.classList.add(type);
    
    toastIcon.textContent = type === 'success' ? '✅' : '❌';
    toastTitle.textContent = title;
    toastMessage.textContent = message;
    
    toast.classList.add('show');
    
    setTimeout(() => {
        toast.classList.remove('show');
    }, 4000);
}

// 실시간 유효성 검사
document.getElementById('name').addEventListener('input', (e) => {
    const input = e.target;
    const value = input.value.trim();
    
    if (value.length >= 2) {
        input.classList.remove('error');
        input.classList.add('success');
        document.getElementById('nameIcon').textContent = '✓';
        document.getElementById('nameIcon').style.color = '#10b981';
    } else {
        input.classList.remove('success');
        document.getElementById('nameIcon').textContent = '';
    }
});

document.getElementById('email').addEventListener('input', (e) => {
    const input = e.target;
    const value = input.value.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    
    if (emailRegex.test(value)) {
        input.classList.remove('error');
        input.classList.add('success');
        document.getElementById('emailIcon').textContent = '✓';
        document.getElementById('emailIcon').style.color = '#10b981';
    } else {
        input.classList.remove('success');
        document.getElementById('emailIcon').textContent = '';
    }
});

// 비밀번호 강도 체크
document.getElementById('password').addEventListener('input', (e) => {
    const password = e.target.value;
    const strengthDiv = document.getElementById('passwordStrength');
    const strengthFill = document.getElementById('strengthFill');
    const strengthText = document.getElementById('strengthText');
    
    if (password.length === 0) {
        strengthDiv.classList.remove('show');
        return;
    }
    
    strengthDiv.classList.add('show');
    
    let strength = 0;
    if (password.length >= 8) strength++;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
    if (/\d/.test(password)) strength++;
    if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;
    
    strengthFill.className = 'strength-fill';
    strengthText.className = 'strength-text';
    
    if (strength <= 1) {
        strengthFill.classList.add('weak');
        strengthText.classList.add('weak');
        strengthText.textContent = '약함 - 더 강력한 비밀번호를 사용하세요';
    } else if (strength === 2 || strength === 3) {
        strengthFill.classList.add('medium');
        strengthText.classList.add('medium');
        strengthText.textContent = '보통 - 특수문자를 추가하면 더 안전합니다';
    } else {
        strengthFill.classList.add('strong');
        strengthText.classList.add('strong');
        strengthText.textContent = '강함 - 안전한 비밀번호입니다!';
        document.getElementById('passwordIcon').textContent = '✓';
        document.getElementById('passwordIcon').style.color = '#10b981';
    }
});

// 전체 약관 동의
function toggleAllTerms() {
    const agreeAll = document.getElementById('agreeAll');
    const checkboxes = document.querySelectorAll('.term-checkbox');
    checkboxes.forEach(cb => cb.checked = agreeAll.checked);
}

// 개별 약관 체크 시 전체 동의 업데이트
document.querySelectorAll('.term-checkbox').forEach(cb => {
    cb.addEventListener('change', () => {
        const all = document.querySelectorAll('.term-checkbox');
        const checked = document.querySelectorAll('.term-checkbox:checked');
        document.getElementById('agreeAll').checked = all.length === checked.length;
    });
});

// 전역 변수
let isEmailVerified = false;

// 비밀번호 보기/숨기기 토글
function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🙈'; // 숨기기
    } else {
        input.type = 'password';
        icon.textContent = '👁️'; // 보기
    }
}

// 이메일 인증 코드 발송
async function sendVerificationCode() {
    const email = document.getElementById('email').value.trim();
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const emailError = document.getElementById('emailError');
    
    // 이메일 검증
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        emailError.textContent = '올바른 이메일 형식이 아닙니다';
        emailError.style.color = '#ef4444';
        return;
    }
    
    sendCodeBtn.disabled = true;
    sendCodeBtn.textContent = '발송 중...';
    
    try {
        const response = await fetch('/api/send-verification-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        if (data.success) {
            showToast('발송 완료!', data.message, 'success');

// 이메일 인증 코드 확인
async function verifyEmailCode() {
    const email = document.getElementById('email').value.trim();
    const code = document.getElementById('verificationCode').value.trim();
    const verifyCodeBtn = document.getElementById('verifyCodeBtn');
    const verificationError = document.getElementById('verificationError');
    const verificationIcon = document.getElementById('verificationIcon');
    
    if (!code || code.length !== 6) {
        verificationError.textContent = '6자리 인증 코드를 입력해주세요';
        verificationError.style.color = '#ef4444';
        return;
    }
    
    verifyCodeBtn.disabled = true;
    verifyCodeBtn.textContent = '확인 중...';
    
    try {
        const response = await fetch('/api/verify-email-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code })
        });
        
        const data = await response.json();
        
        if (data.success) {
            showToast('인증 완료!', data.message, 'success');
            verificationError.textContent = '✓ 이메일 인증이 완료되었습니다';
            verificationError.style.color = '#10b981';
            verificationIcon.textContent = '✓';
            verificationIcon.style.color = '#10b981';
            
            // 인증 완료 플래그
            isEmailVerified = true;
            
            // 인증 코드 입력 비활성화
            document.getElementById('verificationCode').disabled = true;
            verifyCodeBtn.textContent = '✓ 인증 완료';
            verifyCodeBtn.style.background = '#94a3b8';
        } else {
            showToast('오류', data.error, 'error');
            verificationError.textContent = data.error;
            verificationError.style.color = '#ef4444';
            verifyCodeBtn.disabled = false;
            verifyCodeBtn.textContent = '✓ 인증 확인';
        }
    } catch (error) {
        console.error('이메일 인증 오류:', error);
        showToast('오류', '서버 오류가 발생했습니다', 'error');
        verifyCodeBtn.disabled = false;
        verifyCodeBtn.textContent = '✓ 인증 확인';
    }
}

// 비밀번호 일치 확인
document.getElementById('passwordConfirm').addEventListener('input', (e) => {
    const password = document.getElementById('password').value;
    const passwordConfirm = e.target.value;
    const errorElement = document.getElementById('passwordConfirmError');
    const input = e.target;
    
    if (passwordConfirm.length === 0) {
        errorElement.textContent = '';
        input.classList.remove('error', 'success');
        return;
    }
    
    if (password === passwordConfirm) {
        errorElement.textContent = '✓ 비밀번호가 일치합니다';
        errorElement.style.color = '#10b981';
        input.classList.remove('error');
        input.classList.add('success');
    } else {
        errorElement.textContent = '✗ 비밀번호가 일치하지 않습니다';
        errorElement.style.color = '#ef4444';
        input.classList.remove('success');
        input.classList.add('error');
    }
});

// 비밀번호 변경 시에도 확인란 검증
document.getElementById('password').addEventListener('input', (e) => {
    const passwordConfirm = document.getElementById('passwordConfirm').value;
    if (passwordConfirm.length > 0) {
        // 비밀번호 확인란에 input 이벤트 트리거
        document.getElementById('passwordConfirm').dispatchEvent(new Event('input'));

});

// 회원가입 처리
async function handleSignup(e) {
    e.preventDefault();
    
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('passwordConfirm').value;
    const terms = document.getElementById('terms').checked;
    const privacy = document.getElementById('privacy').checked;
    const marketing = document.getElementById('marketing').checked;
    
    // 이메일 인증 확인
    if (!isEmailVerified) {
        showToast('이메일 인증 필요', '이메일 인증을 완료해주세요', 'error');
        return;
    }
    
    // 필수 약관 체크
    if (!terms || !privacy) {
        showToast('약관 동의 필요', '필수 약관에 동의해주세요', 'error');
        return;
    }
    
    // 비밀번호 검증
    if (password.length < 8) {
        showToast('비밀번호 오류', '비밀번호는 8자 이상이어야 합니다', 'error');
        return;
    }
    
    // 비밀번호 일치 확인
    if (password !== passwordConfirm) {
        showToast('비밀번호 불일치', '비밀번호와 비밀번호 확인이 일치하지 않습니다', 'error');
        return;
    }
    
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '가입 중...';
    
    try {
        const response = await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                name, 
                email, 
                password,
                marketing
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            // 폭죽 효과 시작!
            celebrateSignup(data.user.name);
        } else {
            showToast('회원가입 실패', data.error || '다시 시도해주세요', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = '무료로 시작하기 🚀';
        }
    } catch (error) {
        showToast('오류 발생', '회원가입 중 오류가 발생했습니다', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = '무료로 시작하기 🚀';
    }
}

// 🎉 회원가입 축하 폭죽 효과
function celebrateSignup(userName) {
    // 폭죽 효과 여러 번 발사
    const duration = 3000;
    const animationEnd = Date.now() + duration;
    const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000 };

    function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
    }

    const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
            clearInterval(interval);
            // 폭죽 끝나면 환영 메시지 표시
            showWelcomeModal(userName);
            return;
        }

        const particleCount = 50 * (timeLeft / duration);
        
        // 왼쪽에서
        confetti({
            ...defaults,
            particleCount,
            origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
        });
        
        // 오른쪽에서
        confetti({
            ...defaults,
            particleCount,
            origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
        });
    }, 250);
}
