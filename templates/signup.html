{% extends "base.html" %}

{% block title %}회원가입 - Repost{% endblock %}

{% block extra_css %}
<style>
    .signup-container {
        max-width: 440px;
        margin: 80px auto;
        padding: 20px;
    }

    .signup-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 50px 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .signup-title {
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 10px;
        text-align: center;
    }

    .signup-subtitle {
        color: var(--text-gray);
        text-align: center;
        margin-bottom: 40px;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-label {
        display: block;
        color: var(--text-dark);
        font-weight: 500;
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.2s ease;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .btn-signup {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-signup:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 30px 0;
        color: var(--text-gray);
        font-size: 0.9rem;
    }

    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e2e8f0;
    }

    .login-link {
        text-align: center;
        color: var(--text-gray);
        font-size: 0.95rem;
    }

    .login-link a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    .login-link a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="signup-container">
    <div class="signup-card">
        <h1 class="signup-title">회원가입</h1>
        <p class="signup-subtitle">Repost와 함께 블로그를 성장시키세요!</p>

        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label class="form-label">이름</label>
                <input type="text" id="name" class="form-input" placeholder="홍길동" required>
            </div>

            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" id="email" class="form-input" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" id="password" class="form-input" placeholder="8자 이상 입력하세요" required minlength="8">
            </div>

            <button type="submit" class="btn-signup">무료로 시작하기</button>
        </form>

        <div class="divider">또는</div>

        <div class="login-link">
            이미 계정이 있으신가요? <a href="/login-page">로그인</a>
        </div>
    </div>
</div>

<script>
    async function handleSignup(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        try {
            const response = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                alert('회원가입 성공! 로그인 페이지로 이동합니다.');
                window.location.href = '/login-page';
            } else {
                alert(data.error || '회원가입 실패');
            }
        } catch (error) {
            alert('회원가입 중 오류가 발생했습니다.');
        }
    }
</script>
{% endblock %}
