{% extends "base.html" %}

{% block title %}SEO 점수 체커 - Repost{% endblock %}

{% block extra_css %}
<style>
    /* 홈 배경 그대로 사용 */
    body {
        background: 
            radial-gradient(at 27% 37%, rgba(102, 126, 234, 0.8) 0px, transparent 50%),
            radial-gradient(at 97% 21%, rgba(125, 235, 200, 0.7) 0px, transparent 50%),
            radial-gradient(at 52% 99%, rgba(244, 107, 153, 0.7) 0px, transparent 50%),
            radial-gradient(at 10% 29%, rgba(118, 75, 162, 0.8) 0px, transparent 50%),
            #1a1a2e !important;
        background-attachment: fixed !important;
    }

    .page-header {
        text-align: center;
        padding: 60px 20px 40px;
        animation: fadeInDown 0.6s ease-out;
    }

    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .page-header h1 {
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        font-weight: 800;
        color: white;
        margin-bottom: 10px;
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
    }

    .page-header p {
        font-size: clamp(0.95rem, 2.5vw, 1.1rem);
        color: rgba(255, 255, 255, 0.95);
        font-weight: 500;
    }
    
    .tier-badge {
        display: inline-block;
        background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        color: white;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 6px 14px;
        border-radius: 16px;
        font-size: 0.8rem;
        box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
        margin-left: 12px;
        animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 20px 80px;
    }

    .main-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 28px;
        padding: 35px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                    0 0 0 1px rgba(255, 255, 255, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.8);
        margin-bottom: 30px;
    }

    .card-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-label {
        display: block;
        color: #1a1a2e;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.95rem;
    }

    .input-field {
        width: 100%;
        padding: 14px 18px;
        background: white;
        border: 2px solid #e2e8f0;
        border-radius: 14px;
        color: #1a1a2e;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.3s ease;
    }

    .input-field:focus {
        outline: none;
        background: #f8fafc;
        border-color: #ec4899;
        box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
    }

    .input-field::placeholder {
        color: #94a3b8;
    }

    textarea.input-field {
        resize: vertical;
        min-height: 200px;
    }

    .analyze-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 24px rgba(236, 72, 153, 0.4);
    }

    .analyze-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(236, 72, 153, 0.5);
    }

    .analyze-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .copy-all-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        margin-bottom: 20px;
    }

    .copy-all-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    }

    .copy-all-btn.copied {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    }

    .score-display {
        text-align: center;
        padding: 40px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 24px;
        margin-bottom: 30px;
    }

    .score-number {
        font-size: 5rem;
        font-weight: 900;
        color: white;
        line-height: 1;
        margin-bottom: 10px;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .score-label {
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.95);
        font-weight: 600;
    }

    .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 25px;
    }

    .metric-card {
        background: #f8fafc;
        border: 2px solid #e2e8f0;
        border-radius: 16px;
        padding: 20px;
        transition: all 0.3s ease;
    }

    .metric-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .metric-value {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 5px;
    }

    .metric-value.good { color: #10b981; }
    .metric-value.warning { color: #f59e0b; }
    .metric-value.bad { color: #ef4444; }

    .metric-label {
        font-size: 0.9rem;
        color: #64748b;
        font-weight: 600;
    }

    .issue-section {
        margin-bottom: 25px;
    }

    .issue-title {
        font-size: 1.2rem;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .issue-list {
        list-style: none;
        padding: 0;
    }

    .issue-item {
        background: #f8fafc;
        border-left: 4px solid #ef4444;
        padding: 15px 20px;
        margin-bottom: 10px;
        border-radius: 8px;
        font-weight: 500;
        color: #475569;
    }

    .issue-item.warning {
        border-left-color: #f59e0b;
    }

    .issue-item.success {
        border-left-color: #10b981;
    }

    .suggestion-list {
        background: #f0f9ff;
        border: 2px solid #bae6fd;
        border-radius: 16px;
        padding: 20px;
    }

    .suggestion-item {
        padding: 12px 0;
        border-bottom: 1px solid #e0f2fe;
        color: #0c4a6e;
        font-weight: 500;
    }

    .suggestion-item:last-child {
        border-bottom: none;
    }

    .loading {
        text-align: center;
        padding: 60px 20px;
    }

    .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid #e2e8f0;
        border-top-color: #ec4899;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .loading-text {
        color: #475569;
        font-size: 1.1rem;
        font-weight: 600;
    }

    .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: #64748b;
    }

    .empty-icon {
        font-size: 5rem;
        margin-bottom: 20px;
        opacity: 0.5;
    }

    /* Toast 알림 */
    .toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: white;
        color: #1a1a2e;
        padding: 16px 24px;
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 10000;
        animation: slideInUp 0.3s ease-out;
        min-width: 300px;
        border: 2px solid #e2e8f0;
    }

    .toast.error {
        background: #fef2f2;
        border-color: #fecaca;
    }

    .toast.success {
        background: #f0fdf4;
        border-color: #bbf7d0;
    }

    @keyframes slideInUp {
        from {
            opacity: 0;
            transform: translateY(100px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 968px) {
        .main-grid {
            grid-template-columns: 1fr;
        }
        
        .page-header {
            padding: 40px 20px 30px;
        }
        
        .glass-card {
            padding: 24px;
        }
        
        .score-number {
            font-size: 3.5rem;
        }
        
        .toast {
            right: 20px;
            left: 20px;
            min-width: auto;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>🎯 SEO 점수 체커<span class="tier-badge">⭐ Tier S</span></h1>
    <p>블로그 글의 검색 최적화 점수를 실시간으로 분석합니다</p>
</div>

<div class="container">
    <div class="main-grid">
        <!-- 📝 입력 섹션 -->
        <div class="glass-card">
            <h2 class="card-title">
                <span>✍️</span>
                글 정보 입력
            </h2>
            
            <div class="input-group">
                <label class="input-label">제목</label>
                <input type="text" 
                       id="titleInput" 
                       class="input-field" 
                       placeholder="블로그 글 제목을 입력하세요">
            </div>

            <div class="input-group">
                <label class="input-label">본문 내용</label>
                <textarea id="contentInput" 
                          class="input-field" 
                          placeholder="블로그 본문 내용을 붙여넣으세요...

최소 100자 이상 권장"></textarea>
            </div>

            <div class="input-group">
                <label class="input-label">타겟 키워드 (선택)</label>
                <input type="text" 
                       id="keywordInput" 
                       class="input-field" 
                       placeholder="예: 강남 맛집">
            </div>

            <button id="analyzeBtn" class="analyze-btn" onclick="analyzeSEO()">
                🎯 SEO 분석 시작
            </button>
        </div>

        <!-- 📊 결과 섹션 -->
        <div class="glass-card">
            <h2 class="card-title">
                <span>📈</span>
                SEO 분석 결과
            </h2>

            <div id="resultsContainer">
                <div class="empty-state">
                    <div class="empty-icon">🎯</div>
                    <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; color: #1a1a2e;">아직 분석된 결과가 없습니다</div>
                    <div style="font-size: 0.95rem; opacity: 0.7;">왼쪽에서 정보를 입력하고 분석을 시작하세요</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Toast 알림
    function showToast(message, type = 'info') {
        const existingToast = document.querySelector('.toast');
        if (existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icon = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
        toast.innerHTML = `<span style="font-size: 1.5rem;">${icon}</span><span style="font-weight: 600;">${message}</span>`;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = 'slideInUp 0.3s ease-out reverse';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // 공통 복사 함수
    function copyToClipboard(text, button, successMessage = '복사 완료!') {
        navigator.clipboard.writeText(text).then(() => {
            const originalHTML = button.innerHTML;
            button.innerHTML = '복사됨! ✓';
            button.classList.add('copied');
            showToast(successMessage, 'success');
            setTimeout(() => {
                button.innerHTML = originalHTML;
                button.classList.remove('copied');
            }, 2000);
        }).catch(err => {
            showToast('복사에 실패했습니다', 'error');
            console.error('복사 오류:', err);
        });
    }

    // 전체 결과 복사
    function copyAllResults() {
        const resultsContainer = document.getElementById('resultsContainer');
        const textToCopy = resultsContainer.innerText;
        const button = event.target;
        copyToClipboard(textToCopy, button, 'SEO 분석 결과가 복사되었습니다!');
    }

    async function analyzeSEO() {
        const title = document.getElementById('titleInput').value.trim();
        const content = document.getElementById('contentInput').value.trim();
        const keyword = document.getElementById('keywordInput').value.trim();
        const btn = document.getElementById('analyzeBtn');
        const container = document.getElementById('resultsContainer');

        if (!title || !content) {
            showToast('제목과 본문을 모두 입력해주세요!', 'error');
            return;
        }

        if (content.length < 100) {
            showToast('본문이 너무 짧습니다. 최소 100자 이상 입력해주세요!', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span style="display: inline-block; animation: spin 1s linear infinite;">🎯</span> SEO 분석 중...';
        container.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <div class="loading-text">AI가 SEO를 분석하고 있습니다...</div>
                <div style="color: #94a3b8; font-size: 0.9rem; margin-top: 10px;">잠시만 기다려주세요</div>
            </div>
        `;

        try {
            const response = await fetch('/api/check-seo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content, keyword })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: 서버 오류`);
            }

            const data = await response.json();

            if (data.success) {
                displayResults(data.analysis);
                showToast('SEO 분석이 완료되었습니다!', 'success');
            } else {
                throw new Error(data.error || 'SEO 분석 실패');
            }
        } catch (error) {
            console.error('분석 오류:', error);
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">❌</div>
                    <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; color: #dc2626;">분석 중 오류가 발생했습니다</div>
                    <div style="font-size: 0.95rem; opacity: 0.7; margin-bottom: 20px;">${error.message}</div>
                    <button onclick="analyzeSEO()" style="padding: 10px 20px; background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
                        🔄 다시 시도
                    </button>
                </div>
            `;
            showToast('SEO 분석 중 오류가 발생했습니다', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '🎯 SEO 분석 시작';
        }
    }

    function displayResults(analysis) {
        const container = document.getElementById('resultsContainer');
        
        const scoreClass = analysis.score >= 80 ? 'good' : analysis.score >= 60 ? 'warning' : 'bad';
        
        let html = '<button class="copy-all-btn" onclick="copyAllResults()">📋 전체 결과 복사하기</button>';
        
        html += `
            <div class="score-display">
                <div class="score-number">${analysis.score}</div>
                <div class="score-label">SEO 점수 / 100</div>
            </div>
        `;

        html += '<div class="metrics-grid">';
        for (const [key, value] of Object.entries(analysis.metrics)) {
            const metricClass = value.status === 'good' ? 'good' : value.status === 'warning' ? 'warning' : 'bad';
            html += `
                <div class="metric-card">
                    <div class="metric-value ${metricClass}">${value.value}</div>
                    <div class="metric-label">${value.label}</div>
                </div>
            `;
        }
        html += '</div>';

        if (analysis.issues && analysis.issues.length > 0) {
            html += `
                <div class="issue-section">
                    <div class="issue-title">⚠️ 개선 필요 사항</div>
                    <ul class="issue-list">
                        ${analysis.issues.map(issue => `<li class="issue-item">${issue}</li>`).join('')}
                    </ul>
                </div>
            `;
        }

        if (analysis.suggestions && analysis.suggestions.length > 0) {
            html += `
                <div class="issue-section">
                    <div class="issue-title">💡 개선 제안</div>
                    <div class="suggestion-list">
                        ${analysis.suggestions.map(sug => `<div class="suggestion-item">✓ ${sug}</div>`).join('')}
                    </div>
                </div>
            `;
        }
        
        container.innerHTML = html;
    }
</script>
{% endblock %}
