{% extends "base.html" %}

{% block title %}AI 글쓰기 도우미 - Repost{% endblock %}

{% block extra_css %}
<style>
    /* 홈 배경 그대로 사용 */
    body {
        background: 
            radial-gradient(at 27% 37%, rgba(102, 126, 234, 0.8) 0px, transparent 50%),
            radial-gradient(at 97% 21%, rgba(125, 235, 200, 0.7) 0px, transparent 50%),
            radial-gradient(at 52% 99%, rgba(244, 107, 153, 0.7) 0px, transparent 50%),
            radial-gradient(at 10% 29%, rgba(118, 75, 162, 0.8) 0px, transparent 50%),
            #1a1a2e !important;
        background-attachment: fixed !important;
    }

    .page-header {
        text-align: center;
        padding: 60px 20px 40px;
        animation: fadeInDown 0.6s ease-out;
    }

    @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .page-header h1 {
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        font-weight: 800;
        color: white;
        margin-bottom: 10px;
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
    }

    .page-header p {
        font-size: clamp(0.95rem, 2.5vw, 1.1rem);
        color: rgba(255, 255, 255, 0.95);
        font-weight: 500;
    }
    
    .tier-badge {
        display: inline-block;
        background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        color: white;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 6px 14px;
        border-radius: 16px;
        font-size: 0.8rem;
        box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        margin-left: 12px;
        animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 20px 80px;
    }

    .main-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 28px;
        padding: 35px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                    0 0 0 1px rgba(255, 255, 255, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.8);
        margin-bottom: 30px;
    }

    .card-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-label {
        display: block;
        color: #1a1a2e;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.95rem;
    }

    .input-field {
        width: 100%;
        padding: 14px 18px;
        background: white;
        border: 2px solid #e2e8f0;
        border-radius: 14px;
        color: #1a1a2e;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.3s ease;
    }

    .input-field:focus {
        outline: none;
        background: #f8fafc;
        border-color: #ec4899;
        box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
    }

    .input-field::placeholder {
        color: #94a3b8;
    }

    textarea.input-field {
        resize: vertical;
        min-height: 150px;
    }

    .mode-selector {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 20px;
    }

    .mode-option {
        padding: 14px 16px;
        background: white;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        color: #475569;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
    }

    .mode-option:hover {
        background: #f8fafc;
        transform: translateY(-2px);
    }

    .mode-option.active {
        background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        border-color: #8b5cf6;
        color: white;
        box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
    }

    .generate-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
    }

    .generate-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(139, 92, 246, 0.5);
    }

    .generate-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .copy-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        margin-top: 20px;
    }

    .copy-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    }

    .copy-btn.copied {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    }

    .output-container {
        background: #f8fafc;
        border: 2px solid #e2e8f0;
        border-radius: 18px;
        padding: 30px;
        min-height: 400px;
        line-height: 1.8;
        color: #1a1a2e;
        font-size: 1.05rem;
        white-space: pre-wrap;
    }

    .loading {
        text-align: center;
        padding: 60px 20px;
    }

    .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid #e2e8f0;
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .loading-text {
        color: #475569;
        font-size: 1.1rem;
        font-weight: 600;
    }

    .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: #64748b;
    }

    .empty-icon {
        font-size: 5rem;
        margin-bottom: 20px;
        opacity: 0.5;
    }

    /* Toast 알림 */
    .toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: white;
        color: #1a1a2e;
        padding: 16px 24px;
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 10000;
        animation: slideInUp 0.3s ease-out;
        min-width: 300px;
        border: 2px solid #e2e8f0;
    }

    .toast.error {
        background: #fef2f2;
        border-color: #fecaca;
    }

    .toast.success {
        background: #f0fdf4;
        border-color: #bbf7d0;
    }

    @keyframes slideInUp {
        from {
            opacity: 0;
            transform: translateY(100px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 968px) {
        .main-grid {
            grid-template-columns: 1fr;
        }
        
        .page-header {
            padding: 40px 20px 30px;
        }
        
        .glass-card {
            padding: 24px;
        }
        
        .mode-selector {
            grid-template-columns: 1fr;
        }
        
        .toast {
            right: 20px;
            left: 20px;
            min-width: auto;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>✍️ AI 글쓰기 도우미<span class="tier-badge">💎 PRO</span></h1>
    <p>전문 블로거처럼 자연스럽고 매력적인 글을 AI가 작성합니다</p>
</div>

<div class="container">
    <div class="main-grid">
        <!-- 📝 입력 섹션 -->
        <div class="glass-card">
            <h2 class="card-title">
                <span>📝</span>
                글쓰기 설정
            </h2>
            
            <div class="input-group">
                <label class="input-label">모드 선택</label>
                <div class="mode-selector">
                    <div class="mode-option active" data-mode="generate">✨ 새 글 작성</div>
                    <div class="mode-option" data-mode="improve">🔧 기존 글 개선</div>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">주제 또는 키워드</label>
                <input type="text" 
                       id="topicInput" 
                       class="input-field" 
                       placeholder="예: 강남 파스타 맛집 리뷰">
            </div>

            <div class="input-group" id="contentGroup" style="display: none;">
                <label class="input-label">개선할 글</label>
                <textarea id="contentInput" 
                          class="input-field" 
                          placeholder="개선하고 싶은 글을 붙여넣으세요..."></textarea>
            </div>

            <div class="input-group">
                <label class="input-label">추가 요청사항 (선택)</label>
                <textarea id="requestInput" 
                          class="input-field" 
                          placeholder="예: 친근한 말투로, 맛 중심으로 설명, 가격 정보 포함"
                          style="min-height: 100px;"></textarea>
            </div>

            <button id="generateBtn" class="generate-btn" onclick="generateContent()">
                ✨ AI 글쓰기 시작
            </button>
        </div>

        <!-- 📊 결과 섹션 -->
        <div class="glass-card">
            <h2 class="card-title">
                <span>📄</span>
                생성된 글
            </h2>

            <div id="outputContainer" class="output-container">
                <div class="empty-state">
                    <div class="empty-icon">✍️</div>
                    <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; color: #1a1a2e;">아직 생성된 글이 없습니다</div>
                    <div style="font-size: 0.95rem; opacity: 0.7;">왼쪽에서 주제를 입력하고 생성을 시작하세요</div>
                </div>
            </div>

            <button id="copyBtn" class="copy-btn" onclick="copyContent()" style="display: none;">
                📋 생성된 글 복사하기
            </button>
        </div>
    </div>
</div>

<script>
    let selectedMode = 'generate';
    let generatedText = '';

    // Toast 알림
    function showToast(message, type = 'info') {
        const existingToast = document.querySelector('.toast');
        if (existingToast) existingToast.remove();
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icon = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
        toast.innerHTML = `<span style="font-size: 1.5rem;">${icon}</span><span style="font-weight: 600;">${message}</span>`;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = 'slideInUp 0.3s ease-out reverse';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // 공통 복사 함수
    function copyToClipboard(text, button, successMessage = '복사 완료!') {
        navigator.clipboard.writeText(text).then(() => {
            const originalHTML = button.innerHTML;
            button.innerHTML = '복사됨! ✓';
            button.classList.add('copied');
            showToast(successMessage, 'success');
            setTimeout(() => {
                button.innerHTML = originalHTML;
                button.classList.remove('copied');
            }, 2000);
        }).catch(err => {
            showToast('복사에 실패했습니다', 'error');
            console.error('복사 오류:', err);
        });
    }

    // 모드 선택
    document.querySelectorAll('.mode-option').forEach(option => {
        option.addEventListener('click', () => {
            document.querySelectorAll('.mode-option').forEach(opt => opt.classList.remove('active'));
            option.classList.add('active');
            selectedMode = option.dataset.mode;
            
            const contentGroup = document.getElementById('contentGroup');
            contentGroup.style.display = selectedMode === 'improve' ? 'block' : 'none';
        });
    });

    // 글 복사
    function copyContent() {
        const button = document.getElementById('copyBtn');
        copyToClipboard(generatedText, button, '생성된 글이 복사되었습니다!');
    }

    async function generateContent() {
        const topic = document.getElementById('topicInput').value.trim();
        const content = document.getElementById('contentInput').value.trim();
        const request = document.getElementById('requestInput').value.trim();
        const btn = document.getElementById('generateBtn');
        const container = document.getElementById('outputContainer');
        const copyBtn = document.getElementById('copyBtn');

        if (!topic) {
            showToast('주제를 입력해주세요!', 'error');
            document.getElementById('topicInput').focus();
            return;
        }

        if (selectedMode === 'improve' && !content) {
            showToast('개선할 글을 입력해주세요!', 'error');
            document.getElementById('contentInput').focus();
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span style="display: inline-block; animation: spin 1s linear infinite;">✨</span> AI가 글을 작성하는 중...';
        copyBtn.style.display = 'none';
        container.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <div class="loading-text">전문 블로거처럼 글을 작성하고 있습니다...</div>
                <div style="color: #94a3b8; font-size: 0.9rem; margin-top: 10px;">잠시만 기다려주세요 (최대 30초)</div>
            </div>
        `;

        try {
            const endpoint = selectedMode === 'generate' ? '/api/generate-content' : '/api/improve-content';
            const payload = selectedMode === 'generate' 
                ? { topic, request }
                : { content, request };

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: 서버 오류`);
            }

            const data = await response.json();

            if (data.success) {
                generatedText = data.content;
                container.innerHTML = generatedText;
                copyBtn.style.display = 'block';
                showToast('글 작성이 완료되었습니다!', 'success');
            } else {
                throw new Error(data.error || '글 생성 실패');
            }
        } catch (error) {
            console.error('생성 오류:', error);
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">❌</div>
                    <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; color: #dc2626;">글 생성 중 오류가 발생했습니다</div>
                    <div style="font-size: 0.95rem; opacity: 0.7; margin-bottom: 20px;">${error.message}</div>
                    <button onclick="generateContent()" style="padding: 10px 20px; background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
                        🔄 다시 시도
                    </button>
                </div>
            `;
            showToast('글 생성 중 오류가 발생했습니다', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '✨ AI 글쓰기 시작';
        }
    }
</script>
{% endblock %}
